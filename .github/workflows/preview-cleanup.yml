name: Preview cleanup

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-development-preview
  cancel-in-progress: true

jobs:
  cleanup:
    if: >-
      github.repository == 'chameleonjp-lab/doppan' &&
      github.ref == 'refs/heads/main' &&
      vars.DEVELOPMENT_PREVIEW_ENABLED == 'true'
    name: publish root guide only
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify root guide inputs
        run: |
          test "$(git ls-tree HEAD pages/root/root-guide.html | cut -d' ' -f1)" = "100644"
          test "$(git ls-tree HEAD pages/root/robots.txt | cut -d' ' -f1)" = "100644"
          test -f pages/root/root-guide.html
          test ! -L pages/root/root-guide.html
          test -f pages/root/robots.txt
          test ! -L pages/root/robots.txt
      - name: Rebuild Pages tree (root guide only)
        run: |
          rm -rf _site
          mkdir -p _site
          cp pages/root/root-guide.html _site/index.html
          cp pages/root/robots.txt _site/robots.txt
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: _site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
