name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  VITE_BUILD_ENV: test
  VITE_BUILD_TARGET: CI
  VITE_COMMIT_SHA: ${{ github.sha }}

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Setup Node 24.19.0
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.19.0
          cache: npm
      - name: Verify Node and npm versions
        run: |
          test "$(node --version)" = "v24.19.0"
          test "$(npm --version)" = "11.17.0"
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit and physics tests
        run: npm test
      - name: Record build time
        run: echo "VITE_BUILD_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - name: Build
        run: npm run build
      - name: Gzip size budget
        run: npm run size
      - name: Upload dist artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: dist-quality
          path: dist
          if-no-files-found: error

  browser:
    name: browser (${{ matrix.browser }})
    needs: quality
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        browser:
          - chromium
          - webkit
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Setup Node 24.19.0
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.19.0
          cache: npm
      - name: Verify Node and npm versions
        run: |
          test "$(node --version)" = "v24.19.0"
          test "$(npm --version)" = "11.17.0"
      - name: Install dependencies
        run: npm ci
      - name: Download quality dist artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: dist-quality
          path: dist
      - name: Install ${{ matrix.browser }}
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Browser tests
        run: npx playwright test --project=${{ matrix.browser }}
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: browser-evidence-${{ matrix.browser }}
          retention-days: 7
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
